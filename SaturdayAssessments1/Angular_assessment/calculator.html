<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>

    <!-- ✅ Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light d-flex justify-content-center align-items-center vh-100">

    <div class="card shadow p-4 text-center" style="width: 400px; border-radius: 15px;">

        <h1 class="mb-2">Index - Simple Calculator</h1>
        <h5 class="text-muted mb-3">Made By Ritik Kumar</h5>

        <div class="mb-3 text-start">
            <label for="a" class="form-label">First integer</label>
            <input type="number" class="form-control" id="a">
        </div>

        <div class="mb-3 text-start">
            <label for="b" class="form-label">Second integer</label>
            <input type="number" class="form-control" id="b">
        </div>

        <!-- Buttons -->
        <div class="d-grid gap-2">
            <div class="row">
                <div class="col">
                    <button class="btn btn-success w-100" onclick="add()">Add</button>
                </div>
                <div class="col">
                    <button class="btn btn-primary w-100" onclick="sub()">Subtract</button>
                </div>
            </div>

            <div class="row">
                <div class="col">
                    <button class="btn btn-warning w-100" onclick="Multiply()">Multiply</button>
                </div>
                <div class="col">
                    <button class="btn btn-danger w-100" onclick="divide()">Division</button>
                </div>
            </div>
        </div>

        <!-- Result -->
        <div class="alert alert-secondary mt-4" id="result">
            Result will appear here
        </div>

    </div>

</body>

<script>
    var result=document.getElementById("result");

    function getValues() {
        let a = Number(document.getElementById("a").value);
        let b = Number(document.getElementById("b").value);
        return { a, b };
    }

    function add(){
        let {a,b}=getValues();
        let ans= a+b;
        result.innerHTML = `${a} + ${b} = ${ans}`;
    }
    
    function sub(){
        let {a,b}=getValues();
        let ans= a-b;
        result.innerHTML = `${a} - ${b} = ${ans}`;
    }

    function divide(){
        let {a,b}=getValues();
        if (b==0) result.innerHTML="Cannot divide by zero";
        else result.innerHTML = `${a} / ${b} = ${ans = a/b}`;
    }

    function Multiply(){
        let {a,b}=getValues();
        let ans= a*b;
        result.innerHTML = `${a} * ${b} = ${ans}`;
    }
</script>
</html>
